[project]
name = "obi-sweep"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Savage", email = "dan.mcsavage@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.1",
    "numpy>=2.5.5",
    "polars>=2.2.0",
    "pyarrow>=26.0.1",
]

[project.scripts]
obi-sweep = "obi_sweep:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "maturin>=1.16.0",
    "py-spy>=0.4.4",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
